minimum_pre_commit_version: "4.6.1"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: debug-statements
      - id: check-ast
      - id: no-commit-to-branch
        args: [--branch=main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [--select=WPS]
        additional_dependencies:
          - wemake-python-styleguide==1.8.0

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: []
        pass_filenames: false
        additional_dependencies:
          - hypothesis==6.165.10
          - openpyxl==3.1.5
          - pytest==9.1.1
          - pytest-benchmark==5.2.3
          - types-openpyxl==3.1.5.20260807
          - xlsxwriter==3.2.9

  - repo: https://github.com/osprey-oss/deptry.git
    rev: 0.25.1
    hooks:
      - id: deptry
        entry: deptry src

  - repo: https://github.com/seddonym/import-linter
    rev: v2.13
    hooks:
      - id: import-linter

  - repo: local
    hooks:
      - id: api-compatibility
        name: validate API compatibility with Griffe
        entry: python scripts/check_api_compatibility.py
        language: system
        pass_filenames: false
        types: [python]

      - id: changelog
        name: validate Towncrier fragments
        entry: towncrier build --draft --version 0.0.0
        language: system
        pass_filenames: false
        files: ^(changelog\.d/|pyproject\.toml$)

      - id: conventional-commit
        name: validate Conventional Commit message
        entry: python scripts/validate_commits.py --message-file
        language: system
        stages: [commit-msg]
