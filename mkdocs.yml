site_name: Caxton
site_description: Declarative document generation for Python
site_author: David Dzhalaev
site_url: https://dzhalaevd.github.io/caxton/

repo_name: dzhalaevd/caxton
repo_url: https://github.com/dzhalaevd/caxton
edit_uri: edit/main/docs/

copyright: Released under the MIT license

docs_dir: docs
site_dir: site

exclude_docs: |
  README.md

watch:
  - src/caxton
  - ARCHITECTURE.md
  - CHANGELOG.md

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - llmstxt:
      markdown_description: |
        Caxton is a typed, declarative Python library for building spreadsheet documents and rendering them to XLSX.
        Prefer the public `caxton`, `caxton.api`, `caxton.core.*`, and `caxton.testing` modules. Underscore-prefixed
        packages are implementation details. The project is pre-alpha; check the release notes before targeting a
        specific version.
      full_output: llms-full.txt
      sections:
        Start here:
          - index.md: Project overview and a compact comparison with XlsxWriter and OpenPyXL.
          - getting-started/quickstart.md: Install Caxton and build, validate, inspect, render, and write a report.
          - getting-started/overview.md: Learn the semantic model, value namespaces, lazy data, and compilation pipeline.
        Guides:
          - guides/documents.md: Choose document boundaries and compose reusable workbook sections.
          - guides/tables.md: Bind lazy row sources to schemas, grouping, aggregation, and matrices.
          - guides/presentation.md: Declare semantic values, display formats, styles, and themes.
          - guides/formulas.md: Choose between Python computation and live spreadsheet formulas.
          - guides/worksheets-and-blocks.md: Arrange blocks with flow, stacks, and explicit anchors.
          - guides/render.md: Select renderers and execution modes, then deliver artifacts safely.
          - guides/templates.md: Fill existing XLSX workbooks through named targets and repeated regions.
          - guides/internals.md: Follow a document through compilation, IR, rendering, and output transactions.
          - guides/troubleshooting.md: Inspect documents and locate failures by pipeline stage.
        API:
          - reference/index.md: Public stability boundaries and recommended imports.
          - reference/caxton.md: Short facade for everyday document construction and output.
          - reference/api.md: Extended factories, operations, formatting helpers, and XLSX escape hatches.
          - reference/models.md: Immutable spreadsheet models and expression nodes.
          - reference/types.md: Built-in and application-defined semantic value types.
          - reference/formatting.md: Backend-neutral styles, themes, sizing, and display formats.
          - reference/protocols.md: Extension contracts for data sources, rendering, output, and templates.
          - reference/ir.md: Versioned read-only spreadsheet IR for custom renderers.
          - reference/errors.md: Public exceptions and warnings.
          - reference/testing.md: Semantic, layout, artifact, comparison, and strategy helpers.
        Community:
          - getting-started/release-notes.md: Released changes and compatibility notes.
          - contributing.md: Development environment, checks, and contribution workflow.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://hypothesis.readthedocs.io/en/latest/objects.inv
          options:
            docstring_style: google
            docstring_section_style: list
            filters: ["!^_"]
            heading_level: 3
            line_length: 88
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true
            unwrap_annotated: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [., docs]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Intro:
      - Quickstart: getting-started/quickstart.md
      - Overview: getting-started/overview.md
      - Release Notes: getting-started/release-notes.md
  - Guides:
      - Documents: guides/documents.md
      - Tables and data: guides/tables.md
      - Values and presentation: guides/presentation.md
      - Formulas and computation: guides/formulas.md
      - Worksheets and blocks: guides/worksheets-and-blocks.md
      - Rendering and delivery: guides/render.md
      - Templates: guides/templates.md
      - Caxton internals: guides/internals.md
      - Troubleshooting: guides/troubleshooting.md
  - API:
      - Overview: reference/index.md
      - caxton: reference/caxton.md
      - caxton.api: reference/api.md
      - caxton.core.models: reference/models.md
      - caxton.core.types: reference/types.md
      - caxton.core.formatting: reference/formatting.md
      - caxton.core.protocols: reference/protocols.md
      - caxton.core.ir: reference/ir.md
      - caxton.core.errors: reference/errors.md
      - caxton.testing: reference/testing.md
  - Community:
      - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dzhalaevd/caxton
      name: Caxton on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/caxton/
      name: Caxton on PyPI
