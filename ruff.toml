preview = true
fix = true
output-prefer-rule-codes = true

target-version = "py311"
line-length = 88
src = ["src"]

extend-exclude = [
    ".agents/**"
]


[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false


[lint]
select = ["ALL"]

ignore = [
    # Конфликты с Ruff Formatter:
    "COM812",
    "E203",
    "E302",
    "ISC001",
    # Docstrings:
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D205",
    "D213",
    "D401",
    "D404",
    "D405",
    "D418",
    # Аннотации проверяются mypy:
    "ANN",
    # Архитектурные и стилевые решения проекта:
    "A005",
    "B024",
    "ERA001",
    "FBT001",
    "FBT002",
    "INP001",
    "N811",
    "N818",
    "PLR09",
    "PLR2004",
    "PLR6301",
    "S110",
    "TRY003",
    # Кириллица и Unicode:
    "RUF001",
    "RUF002",
    "RUF003",
    # Старый стиль кодов и комментариев Ruff:
    "RUF067",
    "RUF105",
    "RUF106",
    "RUF201",
    "ISC003",
    "CPY001",
    # Public annotations remain resolvable through typing.get_type_hints():
    "TC001",
    "TC002",
    "TC003",
]

external = ["WPS"]


[lint.flake8-import-conventions]
banned-from = ["datetime"]


[lint.flake8-import-conventions.aliases]
datetime = "dt"


[lint.flake8-builtins]
builtins-ignorelist = ["id"]


[lint.flake8-quotes]
inline-quotes = "double"


[lint.mccabe]
max-complexity = 6


[lint.pydocstyle]
convention = "google"


[lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

no-lines-before = []
combine-as-imports = true

[lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",
]
