name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    permissions:
      contents: read
      id-token: write  # Let the nested coverage job authenticate to Codecov.
    uses: ./.github/workflows/ci.yml

  attest:
    name: Attest validated distributions
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write  # Store provenance for the validated distributions.
      contents: read
      id-token: write  # Sign provenance through GitHub OIDC.
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [quality, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write  # Dispatch the isolated Trusted Publishing workflow.
      contents: write  # Create the GitHub Release and upload its assets.
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Verify tag, distributions, and checksums
        env:
          PACKAGE_VERSION: ${{ needs.quality.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')" = "1"
          sha256sum --check dist/SHA256SUMS

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.quality.outputs.prerelease }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          arguments=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --title "Caxton $RELEASE_TAG"
            --generate-notes
            --verify-tag
            --draft
          )
          if [ "$PRERELEASE" = true ]; then
            arguments+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft \
                --jq .isDraft
            )"
            if [ "$is_draft" = false ]; then
              existing_dir="$(mktemp -d)"
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$existing_dir" \
                --pattern SHA256SUMS
              cmp dist/SHA256SUMS "$existing_dir/SHA256SUMS"
              echo "Release already exists with the validated distributions."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          else
            gh release create "${arguments[@]}" \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          fi

      - name: Publish GitHub Release after all assets are attached
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Dispatch the Trusted Publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            --field release-tag="$RELEASE_TAG"
