name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published GitHub Release tag containing the distributions
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-${{ inputs.release-tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Retrieve release distributions
    if: github.event_name == 'workflow_dispatch' || github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read  # Verify provenance for the release distributions.
      contents: read
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        shell: bash
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --pattern SHA256SUMS

      - name: Verify release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')" = "1"
          sha256sum --check dist/SHA256SUMS
          for distribution in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$distribution" --repo "$GITHUB_REPOSITORY"
          done
          python3 - <<'PY'
          import email
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              metadata_file = next(
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_file))

          expected_tag = f"v{metadata['Version']}"
          if metadata["Name"] != "caxton" or os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"release/tag mismatch: {metadata['Name']=}, {expected_tag=}",
              )
          PY

      - name: Stage exact release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/caxton/
    permissions:
      id-token: write  # Authenticate to PyPI via Trusted Publishing.
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypi-distributions
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          print-hash: true
          skip-existing: true
