name: Codecov

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to generate the combined report
        required: true
        type: string
      uv-version:
        description: uv version used to install coverage tooling
        required: true
        type: string

permissions: {}

jobs:
  report:
    name: Combine and upload coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # Authenticate same-repository uploads to Codecov via OIDC.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          version: ${{ inputs.uv-version }}

      - name: Install locked coverage tooling
        run: uv sync --locked --only-group coverage

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Combine coverage and generate XML
        env:
          COVERAGE_FILE: coverage/.coverage
        run: |
          uv run --no-sync coverage combine coverage
          uv run --no-sync coverage xml -o coverage.xml
          uv run --no-sync coverage report

      - name: Upload authenticated coverage to Codecov
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.fork == false &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage.xml
          use_oidc: true

      - name: Upload fork coverage to Codecov
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.fork == true ||
          github.event.pull_request.user.login == 'dependabot[bot]')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage.xml
