name: 🐛 Bug report
description: Report unexpected or incorrect behavior in Caxton.
title: "bug: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please check open issues before submitting to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        A minimal, self-contained code sample that reproduces the issue.
        This is the fastest way to get a fix.
      render: python
      placeholder: |
        from caxton import render, sheet, spreadsheet, table, text

        report = spreadsheet(
            sheet("Sheet1", ...),
        )
        result = render(report)
    validations:
      required: false

  - type: textarea
    id: traceback
    attributes:
      label: Traceback or error output
      description: Full traceback, if any. This will be rendered as a code block automatically.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of Caxton does this relate to?
      options:
        - Public API / models (caxton.api, caxton.core.models)
        - Types & formatting (caxton.core.types, caxton.core.formatting)
        - Data ingestion / evaluation
        - Compilation / layout
        - XLSX rendering (OpenPyXL/XlsxWriter backends)
        - Template handling
        - Testing utilities (caxton.testing)
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: input
    id: caxton-version
    attributes:
      label: Caxton version
      placeholder: e.g. 0.4.2 (run `pip show caxton`)
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.12.4
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 14.5, Ubuntu 22.04, Windows 11
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — related issues, workarounds you tried, screenshots of the generated workbook, etc.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
