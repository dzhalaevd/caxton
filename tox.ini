[tox]
requires =
    tox>=4.52.1,<5
    tox-uv>=1,<2
env_list =
    py311
    py312
    py313
    py314
    pre-commit

[testenv]
description = run the test suite with {base_python}
runner = uv-venv-lock-runner
dependency_groups = test
package = wheel
commands_pre =
    python -c "from pathlib import Path; Path(r'{tox_root}{/}coverage').mkdir(exist_ok=True)"
set_env =
    COVERAGE_FILE = {tox_root}{/}coverage{/}.coverage.{env_name}
commands =
    python -m pytest {env:COVERAGE_ARGS:--cov=caxton --cov-branch --cov-report=term-missing --cov-fail-under=0} {posargs:tests}

[testenv:build]
description = build and validate the wheel and source distribution
runner = uv-venv-lock-runner
dependency_groups = build
package = skip
allowlist_externals = uv
commands =
    uv build --out-dir {tox_root}{/}dist
    twine check {tox_root}{/}dist{/}*

[testenv:pre-commit]
description = run all repository quality, hygiene, and security checks
runner = uv-venv-lock-runner
dependency_groups =
    dependencies
    imports
    maintenance
    pre-commit
package = skip
pass_env = API_BASELINE
set_env =
    PYTHONPATH = {tox_root}{/}src
commands = pre-commit run --all-files --show-diff-on-failure
