[flake8]
exclude =
    .git,
    .venv,
    .agents,
    .benchmarks,
    .hypothesis,
    .idea,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    .ruff_cache,
    .tox,
    dist,
    *.egg-info,
max-line-length = 88
show-source = True
statistics = True
per-file-ignores =
    src/caxton/__init__.py: WPS203
    src/caxton/__version__.py: WPS101, WPS410
    src/caxton/_internal/compiler/spreadsheet.py: WPS203
    src/caxton/_internal/requirements.py: WPS232
    src/caxton/core/models/__init__.py: WPS203
    src/caxton/api/__init__.py: WPS203
    tests/test_spreadsheet_features.py: WPS118, WPS218
    tests/test_templates.py: WPS118, WPS218
    tests/test_xlsx_template_package.py: WPS118, WPS218
extend-ignore =
    E203,
    WPS110,
    WPS201,
    WPS202,
    WPS204,
    WPS210,
    WPS214,
    WPS219,
    WPS221,
    WPS226,
    WPS229,
    WPS231,
    WPS235,
    WPS237,
    WPS300,
    WPS338,
    WPS407,
    WPS410,
    WPS412,
    WPS420,
    WPS430,
    WPS432,
    WPS441,
    WPS501,
    WPS504,
    WPS505,
    WPS604
